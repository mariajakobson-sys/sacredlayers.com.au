<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8e9b86">
    <title>Sacred Layers — Design exploration</title>
    <link rel="stylesheet" href="explorer.css">
  </head>
  <body>
    <div class="explorer">
      <header class="explorer-header">
        <div class="explorer-brand">
          <a class="brand-name" href="design-explorer.html">Sacred Layers<span aria-hidden="true">.</span></a>
          <span class="brand-divider" aria-hidden="true"></span>
          <h1>Design exploration</h1>
        </div>
        <p class="preserved"><span class="green-swatch" aria-hidden="true"></span>Same content, images &amp; original green</p>
      </header>

      <main>
        <section class="explorer-controls" aria-label="Preview controls">
          <div class="concepts" role="group" aria-label="Design direction">
            <button class="concept selected" type="button" data-design="spacious" aria-pressed="true">
              <span class="concept-number" aria-hidden="true">01</span>
              <span>Editorial &amp; layered</span>
            </button>
            <button class="concept" type="button" data-design="immersive" aria-pressed="false">
              <span class="concept-number" aria-hidden="true">02</span>
              <span>Immersive</span>
            </button>
            <button class="concept" type="button" data-design="classic" aria-pressed="false">
              <span class="concept-number" aria-hidden="true">03</span>
              <span>Clean &amp; classic</span>
            </button>
          </div>

          <div class="view-controls">
            <div class="page-control">
              <label for="page-select">Page</label>
              <select id="page-select">
                <option value="home">Home</option>
                <option value="treatments">Treatments</option>
                <option value="about">About</option>
                <option value="testimonials">Testimonials</option>
                <option value="partners">Partners</option>
                <option value="contact">Contact</option>
              </select>
            </div>
            <div class="devices" role="group" aria-label="Preview size">
              <button class="device selected" type="button" data-device="desktop" aria-pressed="true">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="11" rx="1.5"></rect><path d="M7 17h6M10 14v3"></path></svg>
                <span>Desktop</span>
              </button>
              <button class="device" type="button" data-device="mobile" aria-pressed="false">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="2" width="9" height="16" rx="2"></rect><path d="M9 15.5h2"></path></svg>
                <span>Mobile</span>
              </button>
            </div>
          </div>
        </section>

        <section class="preview-stage" aria-label="Website preview">
          <div class="preview-frame" id="preview-frame">
            <div class="preview-bar" aria-hidden="true">
              <div class="window-dots"><i></i><i></i><i></i></div>
              <span>sacredlayers.com.au</span>
              <div class="preview-dot"></div>
            </div>
            <div class="preview-viewport" id="preview-viewport">
              <iframe id="site-preview" src="/?design=spacious" title="Sacred Layers redesign preview"></iframe>
            </div>
          </div>
        </section>
        <div class="preview-caption">
          <p id="preview-summary">Editorial &amp; layered <span aria-hidden="true">·</span> Home <span aria-hidden="true">·</span> Desktop</p>
          <p>Browse the pages to see each direction in context.</p>
        </div>
        <p id="preview-announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
      </main>
    </div>

    <script>
      (() => {
        const designs = { spacious: 'Editorial & layered', immersive: 'Immersive', classic: 'Clean & classic' };
        const pages = { home: 'Home', treatments: 'Treatments', about: 'About', testimonials: 'Testimonials', partners: 'Partners', contact: 'Contact' };
        const query = new URLSearchParams(window.location.search);
        let design = Object.hasOwn(designs, query.get('design')) ? query.get('design') : 'spacious';
        let page = Object.hasOwn(pages, query.get('page')) ? query.get('page') : 'home';
        let device = query.get('view') === 'mobile' ? 'mobile' : 'desktop';
        const iframe = document.querySelector('#site-preview');
        const frame = document.querySelector('#preview-frame');
        const viewport = document.querySelector('#preview-viewport');
        const pageSelect = document.querySelector('#page-select');
        const summary = document.querySelector('#preview-summary');
        const announcement = document.querySelector('#preview-announcement');

        function fitPreview() {
          const availableWidth = viewport.clientWidth;
          if (!availableWidth) return;
          const virtualWidth = device === 'desktop' ? Math.max(1280, availableWidth) : 390;
          const scale = Math.min(1, availableWidth / virtualWidth);
          iframe.style.width = `${virtualWidth}px`;
          iframe.style.height = `${viewport.clientHeight / scale}px`;
          iframe.style.transform = `scale(${scale})`;
        }

        function updateControls(announce = false) {
          document.querySelectorAll('[data-design]').forEach(button => {
            const selected = button.dataset.design === design;
            button.classList.toggle('selected', selected);
            button.setAttribute('aria-pressed', String(selected));
          });
          document.querySelectorAll('[data-device]').forEach(button => {
            const selected = button.dataset.device === device;
            button.classList.toggle('selected', selected);
            button.setAttribute('aria-pressed', String(selected));
          });
          pageSelect.value = page;
          frame.classList.toggle('mobile', device === 'mobile');
          iframe.title = `${pages[page]} — ${designs[design]} redesign preview`;
          const label = `${designs[design]} · ${pages[page]} · ${device === 'mobile' ? 'Mobile' : 'Desktop'}`;
          summary.textContent = label;
          if (announce) announcement.textContent = `Preview updated: ${label}.`;
          const url = new URL(window.location.href);
          url.searchParams.set('design', design);
          url.searchParams.set('page', page);
          url.searchParams.set('view', device);
          window.history.replaceState(null, '', url);
          fitPreview();
        }

        function loadPage(announce = true) {
          const route = page === 'home' ? '/' : `/${page}`;
          iframe.src = `${route}?design=${design}`;
          updateControls(announce);
        }

        document.querySelectorAll('[data-design]').forEach(button => {
          button.addEventListener('click', () => {
            if (button.dataset.design === design) return;
            design = button.dataset.design;
            loadPage();
          });
        });

        document.querySelectorAll('[data-device]').forEach(button => {
          button.addEventListener('click', () => {
            device = button.dataset.device;
            updateControls(true);
          });
        });

        pageSelect.addEventListener('change', () => {
          page = pageSelect.value;
          loadPage();
        });

        iframe.addEventListener('load', () => {
          try {
            const previewUrl = new URL(iframe.contentWindow.location.href);
            if (previewUrl.origin !== window.location.origin) return;
            const currentPage = previewUrl.pathname.replace(/^\/+|\/+$/g, '') || 'home';
            if (Object.hasOwn(pages, currentPage)) page = currentPage;
            if (Object.hasOwn(designs, previewUrl.searchParams.get('design'))) design = previewUrl.searchParams.get('design');
            updateControls();
          } catch (_) {
            // External booking links can be browsed without affecting preview controls.
          }
        });

        const previewObserver = new ResizeObserver(fitPreview);
        previewObserver.observe(viewport);
        loadPage(false);
      })();
    </script>
  </body>
</html>
